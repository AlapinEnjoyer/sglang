# Eight agent users at up to 120k context on 2x RTX A4500 (TP2): vanilla sglang against
# the ampere-opt fork, and the GDN-slot / storage-tier choices for returning sessions.
# This reproduces the 2026-11-08 results in benchmark/ampere_qwen38/RESULTS.md.
#
#   MODEL=/models/Swift-1.5-Qwen3.8-27b-INT4 VANILLA=/path/to/pip-sglang-venv \
#   STUDIO_STORAGE=/nvme/hicache python benchmark/capacity/studio.py run \
#       benchmark/capacity/configs/studio-swift15-2xa4500.toml
#
# Run it with the fork's interpreter: `sglang serve` then resolves to the fork's sglang.
# The vanilla config launches $VANILLA/bin/sglang (0.5.23.dev20261018 was measured).

launch = "sglang serve"
port = 30000
server_args = """
  --model-path $MODEL --served-model-name local --tp 2 --host 127.0.0.1
  --kv-cache-dtype fp8_e4m3 --mamba-ssm-dtype bfloat16
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder
  --chunked-prefill-size 2048 --mamba-radix-cache-strategy extra_buffer_lazy
  --disable-prefill-cuda-graph --context-length 122880 --max-running-requests 8
  --cuda-graph-max-bs-decode 8 --enable-mixed-chunk --prefill-decode-interval 4
  --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1
  --speculative-num-draft-tokens 4 --enable-linear-replayssm-spec
  --enable-hierarchical-cache --hicache-size 12 --hicache-write-policy write_through
"""

[env]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK = "1"
SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR = "$STUDIO_STORAGE"
SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE = "40G"

[steps.cache]
[steps.gsm8k]
[steps.burst]
args = """--context-lens 32k --users 1,4,8 --repeats 2
  --sampling-params '{"temperature":1.0,"top_p":0.95,"top_k":20}'"""
[steps.multiturn]
clients = [10, 20]
[steps.disk]
session_len = 30000

# The original command on vanilla sglang: 264k KV pool, 7 users of 32k fit.
[[configs]]
name = "vanilla"
launch = "$VANILLA/bin/sglang serve"
env = { PATH = "$VANILLA/bin:$PATH" }
server_args = "--mem-fraction-static 0.90 --max-mamba-cache-size 32"
steps = ["cache", "gsm8k", "burst", "multiturn"]

# The fork with the same flags. At 0.90 the 8-user burst ran out of GPU memory: the fork
# frees the draft's duplicate embed/lm_head before sizing the pools, so 0.87 is the cap.
[[configs]]
name = "fork-user-cmd"
server_args = "--mem-fraction-static 0.87 --max-mamba-cache-size 32"
steps = ["cache", "gsm8k", "burst", "multiturn"]

# + FP8 MTP draft and the 32k hot vocabulary: +18-25% decode.
[[configs]]
name = "fork-fp8-map"
server_args = """
  --mem-fraction-static 0.87 --max-mamba-cache-size 32
  --speculative-draft-model-quantization fp8
  --speculative-token-map benchmark/ampere_qwen38/token_maps/swift15_sharegpt_32k.pt
"""
steps = ["cache", "gsm8k", "burst", "multiturn"]

# + 64 GDN state slots: the 20-session hit rate went 0.42 -> 0.68 (ceiling 0.74).
[[configs]]
name = "fork-best-ram"
server_args = """
  --mem-fraction-static 0.87 --max-mamba-cache-size 64
  --speculative-draft-model-quantization fp8
  --speculative-token-map benchmark/ampere_qwen38/token_maps/swift15_sharegpt_32k.pt
"""
steps = ["cache", "burst", "multiturn"]

# + the disk tier. Page size 64 keeps the file backend to one file per 64 tokens
# (page size 1 wrote one 17 KB file per token and per GPU).
[[configs]]
name = "fork-best-disk"
server_args = """
  --mem-fraction-static 0.87 --max-mamba-cache-size 64 --page-size 64
  --speculative-draft-model-quantization fp8
  --speculative-token-map benchmark/ampere_qwen38/token_maps/swift15_sharegpt_32k.pt
  --hicache-storage-backend file --hicache-storage-prefetch-policy wait_complete
"""
steps = ["cache", "multiturn", "disk"]
