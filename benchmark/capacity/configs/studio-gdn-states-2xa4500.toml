# GDN (mamba) state capacity for returning sessions on 2x RTX A4500, Swift-1.5 INT4, TP2.
# Baselines from results/2xa4500-20261108 (same flags): 20 sessions hit 0.487 with 32 slots
# and 0.691 with 64 (ceiling 0.738). This suite tries the two state-saving options:
# - --mamba-max-states-per-path N: drop older snapshots on a session's path; KV stays.
# - --enable-int8-mamba-checkpoint: cached snapshots in int8, about twice as many (lossy).
# It also checks restored sessions against a recompute, and reuse through chat clients.
#
#   MODEL=<Swift-1.5 dir> STUDIO_STORAGE=/nvme/hicache python benchmark/capacity/studio.py run \
#       benchmark/capacity/configs/studio-gdn-states-2xa4500.toml

launch = "sglang serve"
port = 30000
server_args = """
  --model-path $MODEL --served-model-name local --tp 2 --host 127.0.0.1
  --kv-cache-dtype fp8_e4m3 --mamba-ssm-dtype bfloat16 --mem-fraction-static 0.87
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder --enable-cache-report
  --chunked-prefill-size 2048 --mamba-radix-cache-strategy extra_buffer_lazy
  --disable-prefill-cuda-graph --context-length 122880 --max-running-requests 8
  --cuda-graph-max-bs-decode 8 --enable-mixed-chunk --prefill-decode-interval 4
  --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1
  --speculative-num-draft-tokens 4 --enable-linear-replayssm-spec
  --speculative-draft-model-quantization fp8
  --speculative-token-map benchmark/ampere_qwen38/token_maps/swift15_sharegpt_32k.pt
  --enable-hierarchical-cache --hicache-size 12 --hicache-write-policy write_through
"""

[env]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK = "1"
SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR = "$STUDIO_STORAGE"
# Per TP rank: TP2 can write twice this.
SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE = "15G"
SGLANG_HICACHE_FILE_BACKEND_MIN_FREE_SPACE = "10G"

[steps.cache]
[steps.gsm8k]
[steps.multiturn]
clients = [20]
[steps.disk]
session_len = 30000
[steps.chat]

[[configs]]
name = "s32-path2"
server_args = "--max-mamba-cache-size 32 --mamba-max-states-per-path 2"
steps = ["cache", "multiturn"]

[[configs]]
name = "s64-path2"
server_args = "--max-mamba-cache-size 64 --mamba-max-states-per-path 2"
steps = ["cache", "multiturn"]

[[configs]]
name = "s32-int8"
server_args = "--max-mamba-cache-size 32 --enable-int8-mamba-checkpoint"
steps = ["cache", "gsm8k", "multiturn"]

[[configs]]
name = "s64-disk-checks"
server_args = """
  --max-mamba-cache-size 64 --page-size 64
  --hicache-storage-backend file --hicache-storage-prefetch-policy wait_complete
"""
steps = ["cache", "disk", "chat"]
