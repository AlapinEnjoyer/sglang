# How the hit rate falls as rotating sessions outgrow GDN slots and KV, on 2x RTX A4500:
# the best RAM config (64 slots, path cap 2, HiCache 12 GB per GPU) against the same
# config on the GPU only. 8 run at once; 6 rounds of 4000 new + 500 output tokens.
#
#   MODEL=<Swift-1.5 dir> python benchmark/capacity/studio.py run \
#       benchmark/capacity/configs/studio-session-sweep-2xa4500.toml

launch = "sglang serve"
port = 30000
server_args = """
  --model-path $MODEL --served-model-name local --tp 2 --host 127.0.0.1
  --kv-cache-dtype fp8_e4m3 --mamba-ssm-dtype bfloat16 --mem-fraction-static 0.87
  --reasoning-parser qwen3 --tool-call-parser qwen3_coder
  --chunked-prefill-size 2048 --mamba-radix-cache-strategy extra_buffer_lazy
  --disable-prefill-cuda-graph --context-length 122880 --max-running-requests 8
  --cuda-graph-max-bs-decode 8 --enable-mixed-chunk --prefill-decode-interval 4
  --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1
  --speculative-num-draft-tokens 4 --enable-linear-replayssm-spec
  --speculative-draft-model-quantization fp8
  --speculative-token-map benchmark/ampere_qwen38/token_maps/swift15_sharegpt_32k.pt
  --max-mamba-cache-size 64 --mamba-max-states-per-path 2
"""

[env]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK = "1"

[steps.multiturn]
clients = [10, 15, 20, 25, 30, 40]

[[configs]]
name = "s64-path2-hicache"
server_args = "--enable-hierarchical-cache --hicache-size 12 --hicache-write-policy write_through"

[[configs]]
name = "s64-path2-gpu-only"
